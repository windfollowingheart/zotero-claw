<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window });"
>
  <html:h2>LLM</html:h2>
  <div style="display: flex; align-items: center">
    <div>Base URL</div>
    <html:input type="text" preference="llm.baseUrl"></html:input>
  </div>
  <div style="display: flex; align-items: center">
    <div>API Key</div>
    <html:input type="password" preference="llm.apiKey"></html:input>
  </div>
  <div style="display: flex; align-items: center">
    <div>Model</div>
    <html:input type="text" preference="llm.model"></html:input>
  </div>
</groupbox>
